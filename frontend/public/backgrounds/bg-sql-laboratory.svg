<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="labOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF9E80" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Honeycomb Hexagonal Geometry -->
  <g stroke="url(#labOrange)" stroke-width="1.2" fill="none" opacity="0.3">
    <!-- Row 1 -->
    <polygon points="400,200 450,230 450,290 400,320 350,290 350,230"/>
    <polygon points="520,200 570,230 570,290 520,320 470,290 470,230"/>
    <polygon points="640,200 690,230 690,290 640,320 590,290 590,230"/>

    <!-- Row 2 -->
    <polygon points="460,305 510,335 510,395 460,425 410,395 410,335"/>
    <polygon points="580,305 630,335 630,395 580,425 530,395 530,335"/>

    <!-- Right Cluster -->
    <polygon points="1400,600 1450,630 1450,690 1400,720 1350,690 1350,630"/>
    <polygon points="1520,600 1570,630 1570,690 1520,720 1470,690 1470,630"/>
    <polygon points="1460,705 1510,735 1510,795 1460,825 1410,795 1410,735"/>
  </g>

  <!-- Laser Vector Guides -->
  <g stroke="#FFE600" stroke-width="1" stroke-dasharray="8,6" opacity="0.25">
    <line x1="100" y1="540" x2="1820" y2="540"/>
    <line x1="460" y1="425" x2="1400" y2="600"/>
  </g>
</svg>

