<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#00E5FF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="transparent"/>
  <circle cx="800" cy="500" r="500" fill="url(#starGlow)"/>

  <!-- Ghost ER Entity Silhouettes -->
  <g stroke="#FF6B00" stroke-width="1" fill="none" opacity="0.3">
    <!-- Entity 1 (tb_clientes) -->
    <rect x="250" y="200" width="180" height="140" rx="8" stroke="#00E5FF" stroke-width="1.2"/>
    <line x1="250" y1="235" x2="430" y2="235" stroke="#00E5FF"/>
    <line x1="265" y1="260" x2="350" y2="260"/>
    <line x1="265" y1="285" x2="380" y2="285"/>
    <line x1="265" y1="310" x2="330" y2="310"/>

    <!-- Entity 2 (tb_pedidos) -->
    <rect x="650" y="320" width="200" height="170" rx="8" stroke="#FFE600" stroke-width="1.2"/>
    <line x1="650" y1="355" x2="850" y2="355" stroke="#FFE600"/>
    <line x1="670" y1="380" x2="790" y2="380"/>
    <line x1="670" y1="410" x2="760" y2="410"/>
    <line x1="670" y1="440" x2="810" y2="440"/>
    <line x1="670" y1="465" x2="740" y2="465"/>

    <!-- Entity 3 (tb_itens_pedido) -->
    <rect x="1100" y="240" width="190" height="150" rx="8" stroke="#FF6B00" stroke-width="1.2"/>
    <line x1="1100" y1="275" x2="1290" y2="275" stroke="#FF6B00"/>
    <line x1="1120" y1="300" x2="1240" y2="300"/>
    <line x1="1120" y1="330" x2="1220" y2="330"/>
    <line x1="1120" y1="360" x2="1200" y2="360"/>

    <!-- Entity 4 (tb_produtos) -->
    <rect x="1500" y="400" width="180" height="140" rx="8" stroke="#00E676" stroke-width="1.2"/>
    <line x1="1500" y1="435" x2="1680" y2="435" stroke="#00E676"/>
    <line x1="1520" y1="460" x2="1620" y2="460"/>
    <line x1="1520" y1="490" x2="1640" y2="490"/>
    <line x1="1520" y1="515" x2="1600" y2="515"/>

    <!-- Crow's Foot Orthogonal Connectors -->
    <path d="M430,270 L540,270 L540,400 L650,400" stroke="#00E5FF" stroke-width="1.5"/>
    <path d="M850,400 L970,400 L970,310 L1100,310" stroke="#FFE600" stroke-width="1.5"/>
    <path d="M1290,310 L1400,310 L1400,470 L1500,470" stroke="#FF6B00" stroke-width="1.5"/>
  </g>

  <!-- Distant Stars -->
  <g fill="#FFF" opacity="0.3">
    <circle cx="150" cy="120" r="1.5"/>
    <circle cx="500" cy="160" r="1"/>
    <circle cx="950" cy="180" r="2"/>
    <circle cx="1400" cy="120" r="1.5"/>
    <circle cx="1750" cy="220" r="1"/>
    <circle cx="300" cy="700" r="1"/>
    <circle cx="750" cy="850" r="1.5"/>
    <circle cx="1300" cy="780" r="2"/>
    <circle cx="1650" cy="900" r="1.5"/>
  </g>
</svg>

