<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="holoBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2979FF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Technical HUD Blueprint Concentric Rings -->
  <g stroke="url(#holoBlue)" fill="none" opacity="0.35">
    <circle cx="960" cy="540" r="420" stroke-width="1.5" stroke-dasharray="12,12"/>
    <circle cx="960" cy="540" r="320" stroke-width="1"/>
    <circle cx="960" cy="540" r="220" stroke-width="1.5" stroke-dasharray="4,8"/>
    <circle cx="960" cy="540" r="100" stroke-width="2"/>

    <!-- Crosshairs & Angle Ticks -->
    <line x1="960" y1="60" x2="960" y2="1020" stroke-width="1" stroke-dasharray="8,8"/>
    <line x1="480" y1="540" x2="1440" y2="540" stroke-width="1" stroke-dasharray="8,8"/>

    <!-- Corner Framing Reticles -->
    <path d="M100,160 L100,100 L160,100" stroke-width="2"/>
    <path d="M1820,160 L1820,100 L1760,100" stroke-width="2"/>
    <path d="M100,920 L100,980 L160,980" stroke-width="2"/>
    <path d="M1820,920 L1820,980 L1760,980" stroke-width="2"/>
  </g>

  <!-- Hexagonal Tech Matrix Badges -->
  <g stroke="#FF6B00" stroke-width="1" fill="none" opacity="0.25">
    <polygon points="960,490 1003,515 1003,565 960,590 917,565 917,515"/>
    <polygon points="1200,340 1235,360 1235,400 1200,420 1165,400 1165,360"/>
    <polygon points="720,680 755,700 755,740 720,760 685,740 685,700"/>
  </g>
</svg>
