<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="qGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#6A1B9A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="transparent"/>
  <circle cx="1400" cy="400" r="450" fill="url(#qGlow)"/>
  <circle cx="450" cy="700" r="350" fill="url(#qGlow)"/>

  <!-- Complex Relational Constellations -->
  <g stroke="#00E5FF" stroke-width="1.2" opacity="0.35">
    <!-- Cluster 1 -->
    <line x1="320" y1="280" x2="480" y2="340"/>
    <line x1="480" y1="340" x2="420" y2="480"/>
    <line x1="420" y1="480" x2="260" y2="440"/>
    <line x1="260" y1="440" x2="320" y2="280"/>
    <line x1="480" y1="340" x2="680" y2="310"/>

    <!-- Cluster 2 (Center-Right) -->
    <line x1="1200" y1="250" x2="1380" y2="210"/>
    <line x1="1380" y1="210" x2="1520" y2="350"/>
    <line x1="1520" y1="350" x2="1420" y2="490"/>
    <line x1="1420" y1="490" x2="1240" y2="440"/>
    <line x1="1240" y1="440" x2="1200" y2="250"/>
    <line x1="1380" y1="210" x2="1420" y2="490"/>
    <line x1="1240" y1="440" x2="1080" y2="600"/>

    <!-- Cluster 3 (Bottom) -->
    <line x1="900" y1="720" x2="1080" y2="600"/>
    <line x1="1080" y1="600" x2="1180" y2="760"/>
    <line x1="1180" y1="760" x2="980" y2="880"/>
    <line x1="980" y1="880" x2="900" y2="720"/>
  </g>

  <!-- Glowing Relational Nodes -->
  <g fill="#00E5FF" opacity="0.6">
    <circle cx="320" cy="280" r="4.5"/>
    <circle cx="480" cy="340" r="6" fill="#FF6B00"/>
    <circle cx="420" cy="480" r="5"/>
    <circle cx="260" cy="440" r="4"/>
    <circle cx="680" cy="310" r="5.5" fill="#FFE600"/>

    <circle cx="1200" cy="250" r="5"/>
    <circle cx="1380" cy="210" r="7" fill="#FF6B00"/>
    <circle cx="1520" cy="350" r="5.5"/>
    <circle cx="1420" cy="490" r="6" fill="#00E5FF"/>
    <circle cx="1240" cy="440" r="4.5"/>

    <circle cx="1080" cy="600" r="6.5" fill="#FFE600"/>
    <circle cx="900" cy="720" r="5"/>
    <circle cx="1180" cy="760" r="5.5"/>
    <circle cx="980" cy="880" r="6" fill="#FF4081"/>
  </g>
</svg>

