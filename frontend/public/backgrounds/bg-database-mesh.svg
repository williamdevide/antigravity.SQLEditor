<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="meshCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#FF8533" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="50%" stop-color="#FFE600"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>
  <circle cx="960" cy="540" r="750" fill="url(#meshCenter)"/>
  <!-- Central Cluster -->
  <g stroke="url(#laserGrad)" stroke-width="2.5" fill="none">
    <ellipse cx="960" cy="360" rx="180" ry="60" stroke="#FF6B00" stroke-width="3"/>
    <path d="M780,360 v120 a180,60 0 0,0 360,0 v-120" stroke="#FF6B00" stroke-width="3"/>
    <path d="M780,420 a180,60 0 0,0 360,0" stroke="#FFE600" stroke-width="2"/>
    <path d="M780,480 a180,60 0 0,0 360,0" stroke="#00E5FF" stroke-width="2"/>
    <!-- Left Cluster -->
    <ellipse cx="440" cy="620" rx="140" ry="45" stroke="#00E5FF" stroke-width="2.5"/>
    <path d="M300,620 v90 a140,45 0 0,0 280,0 v-90" stroke="#00E5FF" stroke-width="2.5"/>
    <path d="M300,665 a140,45 0 0,0 280,0" stroke="#00E5FF" stroke-width="2"/>
    <!-- Right Cluster -->
    <ellipse cx="1480" cy="620" rx="140" ry="45" stroke="#FFE600" stroke-width="2.5"/>
    <path d="M1340,620 v90 a140,45 0 0,0 280,0 v-90" stroke="#FFE600" stroke-width="2.5"/>
    <path d="M1340,665 a140,45 0 0,0 280,0" stroke="#FFE600" stroke-width="2"/>
    <!-- Connections -->
    <path d="M960,480 L440,620" stroke="#FF6B00" stroke-width="3" stroke-dasharray="8,6"/>
    <path d="M960,480 L1480,620" stroke="#FFE600" stroke-width="3" stroke-dasharray="8,6"/>
    <path d="M440,710 L960,860 L1480,710" stroke="#00E5FF" stroke-width="2.5"/>
  </g>
  <!-- Bright Nodes -->
  <g fill="#FFF">
    <circle cx="960" cy="480" r="7" fill="#FF6B00"/>
    <circle cx="440" cy="620" r="6" fill="#00E5FF"/>
    <circle cx="1480" cy="620" r="6" fill="#FFE600"/>
    <circle cx="960" cy="860" r="6" fill="#00E676"/>
  </g>
</svg>