<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="horizonGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#FFE600" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="transparent"/>
  <rect x="0" y="300" width="1920" height="780" fill="url(#horizonGlow)"/>
  <!-- Perspective Floor Grid -->
  <g stroke="#FF6B00" stroke-width="2" opacity="0.65">
    <line x1="960" y1="400" x2="-200" y2="1080"/>
    <line x1="960" y1="400" x2="200" y2="1080"/>
    <line x1="960" y1="400" x2="600" y2="1080"/>
    <line x1="960" y1="400" x2="960" y2="1080"/>
    <line x1="960" y1="400" x2="1320" y2="1080"/>
    <line x1="960" y1="400" x2="1720" y2="1080"/>
    <line x1="960" y1="400" x2="2120" y2="1080"/>
    <!-- Horizon Transversals -->
    <line x1="0" y1="450" x2="1920" y2="450" stroke="#FFE600" stroke-width="1.5"/>
    <line x1="0" y1="520" x2="1920" y2="520" stroke="#FFE600" stroke-width="1.8"/>
    <line x1="0" y1="620" x2="1920" y2="620" stroke="#FF6B00" stroke-width="2.2"/>
    <line x1="0" y1="760" x2="1920" y2="760" stroke="#FF6B00" stroke-width="2.5"/>
    <line x1="0" y1="940" x2="1920" y2="940" stroke="#00E5FF" stroke-width="3"/>
  </g>
</svg>