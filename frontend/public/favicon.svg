<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sqleditor-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FFE600" />
    </linearGradient>
    <filter id="sqleditor-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF6B00" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#161922" stroke="url(#sqleditor-grad)" stroke-width="2.5" />
  
  <!-- Subtle Internal Glow Circle -->
  <circle cx="32" cy="32" r="22" fill="#FF6B00" opacity="0.12" />

  <!-- Iconic Lightning Bolt (SQLEditor Symbol) -->
  <path 
    d="M35 8 L17 34 L31 34 L27 56 L47 28 L33 28 Z" 
    fill="url(#sqleditor-grad)" 
    filter="url(#sqleditor-glow)"
  />
